<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ห้องครูฝึก | Hell Week SEAL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;600;800&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body class="locked">

<!-- ========== หน้าล็อกอิน ========== -->
<div id="lock" class="lock">
  <div class="lock-card">
    <div class="lock-mark">⚓</div>
    <h1>HELL WEEK</h1>
    <div class="lock-tabs" id="lockTabs">
      <button type="button" data-lt="student" class="active">นักเรียน</button>
      <button type="button" data-lt="personnel">บุคลากร</button>
      <button type="button" data-lt="dept">แผนก</button>
      <button type="button" data-lt="admin">แอดมิน</button>
    </div>

    <form id="studentForm" autocomplete="off">
      <p>กรอกชื่อและอีเมลเพื่อขอเข้าสอบวิชาการ ครูฝึกต้องอนุญาตก่อนจึงจะเริ่มสอบได้</p>
      <label>ชื่อ Roblox / ชื่อนักเรียน
        <input id="stName" type="text" required minlength="2" maxlength="40" autocomplete="off">
      </label>
      <label>อีเมล
        <input id="stEmail" type="email" required maxlength="80" autocomplete="email">
      </label>
      <button class="btn primary wide" type="submit">เข้าห้องสอบ</button>
    </form>

    <form id="lockForm" autocomplete="off" hidden>
      <p id="loginHint">เข้าสู่ระบบบุคลากร</p>
      <div id="deptFields" hidden>
        <label>เลือกแผนก
          <select id="divSel">
            <option value="office">ธุรการ</option>
            <option value="special">รบพิเศษ</option>
            <option value="support">สนับสนุน</option>
          </select>
        </label>
        <label>ชื่อ Roblox / ชื่อสมาชิก
          <input id="divName" type="text" minlength="2" maxlength="40" autocomplete="off">
        </label>
      </div>
      <label>รหัสผ่าน
        <input id="lockPass" type="password" required autocomplete="current-password">
      </label>
      <button class="btn primary wide" type="submit" id="loginSubmit">เข้าสู่ระบบ</button>
    </form>
    <p class="lock-err" id="lockErr" role="alert"></p>
  </div>
</div>

<!-- ========== ห้องสอบนักเรียน (เห็นเฉพาะหลังนักเรียนล็อกอิน) ========== -->
<div id="student" class="student" hidden>
  <header class="s-head">
    <div class="s-brand">⚓ <b>HELL WEEK</b> <small>ห้องสอบออนไลน์</small></div>
    <div class="s-user"><span id="sName"></span><button class="btn small" id="sLogout">ออกจากระบบ</button></div>
  </header>
  <main class="s-main"><div id="sBody"></div></main>
</div>

<!-- หน้าครูฝึกจะถูกโหลดเข้ามาตรงนี้หลังล็อกอิน (ไม่อยู่ในไฟล์นี้) -->
<div id="appHost"></div>

<dialog id="lightbox">
  <img alt="ภาพ">
  <div class="dlg-actions"><a class="btn primary" id="dlBtn" hidden download>ดาวน์โหลดภาพ</a><button class="btn" id="closeLb">ปิด</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>
<script src="script.js"></script>
</body>
</html>
